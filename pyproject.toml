[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skillscan"
# Keep in step with skillscan/__init__.py's __version__ at release time.
# (Not setuptools-dynamic: the repo-root skillscan.py shim makes
# attr-based version lookup load the shim instead of the package.)
version = "0.8.0"
description = "Deterministic, offline scanner for AI-agent skills and MCP servers — check a skill before you install it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "RakTikoo" },
]
keywords = ["agent-skills", "mcp", "model-context-protocol", "prompt-injection", "scanner", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/RakTikoo/skillscan"
Repository = "https://github.com/RakTikoo/skillscan"

[project.scripts]
skillscan = "skillscan.__main__:main"

[tool.setuptools]
packages = ["skillscan"]

[tool.setuptools.package-data]
skillscan = ["phrases/*.json", "toplists/*.json"]
